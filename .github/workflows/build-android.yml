name: Build Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android project files (first time only)
        run: |
          if [ ! -d android ]; then
            flutter create --org com.saralbook --project-name kids --platforms android /tmp/scaffold
            cp -r /tmp/scaffold/android ./android
          fi

      - name: Flutter version
        run: flutter --version

      - name: Get packages
        run: flutter pub get

      - name: Patch Android manifest (app name, text-to-speech query)
        run: dart run tool/patch_manifest.dart

      - name: Generate translations
        run: flutter gen-l10n

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        continue-on-error: true
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Build release AAB
        run: flutter build appbundle --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: saralbook-kids-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: saralbook-kids-aab
          path: build/app/outputs/bundle/release/app-release.aab
